[package]
name = "mozi-particles"
version = "0.1.0"
edition = "2021"
description = "Native Rust + wgpu 3D wallpaper & agent event particle engine (SILK / PULSE / GLYPH)"

[dependencies]
ab_glyph = "0.2"
bytemuck = { version = "1.16", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
log = "0.4"
pollster = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wgpu = "=22.1.0"
winit = "0.30"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
